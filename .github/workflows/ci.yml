name: Release Readiness CI

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.abbrev"
  GIT_CONFIG_VALUE_0: "40"

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitignore'
      - 'AGENTS.md'
      - '.agentic-sdd-governance/**'
      - '.agents/skills/agentic-sdd-governance/**'
      - '.sddgov/**'
      - 'DEP-*/**'
      - 'evidence/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'specs/**'
      - 'vault/**'
      - 'tests/**'
      - 'scripts/**'
      - 'raw/**'
      - 'benchmarks/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - 'main'
    paths:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitignore'
      - 'AGENTS.md'
      - '.agentic-sdd-governance/**'
      - '.agents/skills/agentic-sdd-governance/**'
      - '.sddgov/**'
      - 'DEP-*/**'
      - 'evidence/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'specs/**'
      - 'vault/**'
      - 'tests/**'
      - 'scripts/**'
      - 'raw/**'
      - 'benchmarks/**'

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run current-state tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_subject_progress.py
          --ignore=tests/test_subject_task_authorization_dispatch.py
          --ignore=tests/test_subject_development_mission_v4.py
          --ignore=tests/test_subject_task_authorization_dispatch_v4.py
          --ignore=tests/test_subject_development_mission_v5.py

      - name: Run candidate Mission V5 identity controls
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          python scripts/run_subject_identity_test_isolation.py
          --phase candidate

      - name: Run active Mission V5 identity controls
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python scripts/run_subject_identity_test_isolation.py
          --phase active

      - name: Replay immutable T-001 progress controls at completion phase
        shell: bash
        env:
          SUBJECT_PRE_T002_CHECKPOINT: 8ec045a7b39c5aa9684f61d9099eb62b3142983d
          T001_PROGRESS_TEST_SHA256: 6be4d93375205ee1f9ba414aa2704ee075ca583050238892d54030e7adadd3e6
          T001_PROGRESS_VALIDATOR_SHA256: 8cb33ef1f9b688be90fb093e0fd4437b245c2a9b2dbac3f3141c65005619416f
          T001_PROGRESS_LEDGER_SHA256: ab723c1adde2739f54deba7fee85d86a95002f167703354695503363154d30e6
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SUBJECT_PRE_T002_CHECKPOINT" HEAD
          replay_root="$RUNNER_TEMP/subject-t001-completion-${{ matrix.python-version }}"
          cleanup() {
            git worktree remove --force "$replay_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$replay_root" "$SUBJECT_PRE_T002_CHECKPOINT"
          cd "$replay_root"
          printf '%s  %s\n' "$T001_PROGRESS_TEST_SHA256" \
            tests/test_subject_progress.py | sha256sum -c -
          printf '%s  %s\n' "$T001_PROGRESS_VALIDATOR_SHA256" \
            scripts/validate_subject_progress.py | sha256sum -c -
          printf '%s  %s\n' "$T001_PROGRESS_LEDGER_SHA256" \
            specs/subject-distillation/implementation-progress.json | sha256sum -c -
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/test_subject_progress.py

      - name: Validate current Subject progress ledger
        run: |
          python scripts/validate_subject_progress.py \
            --manifest specs/subject-distillation/baseline-manifest.json \
            --schema specs/subject-distillation/implementation-progress.schema.json \
            --tasks specs/subject-distillation/tasks.md \
            --progress specs/subject-distillation/implementation-progress.json

      - name: Replay immutable T-003 authorization checkpoint
        shell: bash
        env:
          SUBJECT_T003_CHECKPOINT: f7aff39fecbc2fce7d612f396237afb0e094e460
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SUBJECT_T003_CHECKPOINT" HEAD
          replay_root="$RUNNER_TEMP/subject-t003-completion-${{ matrix.python-version }}"
          cleanup() {
            git worktree remove --force "$replay_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$replay_root" "$SUBJECT_T003_CHECKPOINT"
          cd "$replay_root"
          cat <<'EOF' | sha256sum -c -
          0e455b726ee09f35283f1975ad30a08d988a71ddc71efb0fd02fdba09a922f33  scripts/validate_subject_task_authorization_dispatch.py
          7076d547be933c30e2e8321a3ee47799794137dfe295e6f09f558373cf959b8c  scripts/run_subject_task_authorization_v3.py
          ef0cc8fe7e2fe27928160c28cb92821ac85dbe549acce3f3bf9e7a9528b969ab  scripts/update_subject_task_progress_v3.py
          1251ff4f35373ed8a5b54403f971fa54c3bc71b0b062f0caa939ed1415b2f01b  scripts/validate_subject_task_authorization_v3.py
          9ff7ddceffdde6690fce4acf1b1f9d16f2d0f93412f5e5f55d94d118b7af5c5a  specs/subject-distillation/task-authorization-v3.contract.json
          f226e841e2e5442d9a2fe4443762764c984f409699d696e66cbe49aec79177df  specs/subject-distillation/task-authorization-v3.schema.json
          7bf80b0b2e0abf1a762663ca179361ef65d1bcaa5a2af373697f6a22dca1e359  specs/subject-distillation/task-scopes/T-003.json
          8601f9ff2b8475c6c9eda577cd27c26fe3c6665f3cf9ad9174dedb5975448616  tests/test_subject_task_authorization_dispatch.py
          EOF
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/test_subject_task_authorization_dispatch.py
          python scripts/validate_subject_task_authorization_dispatch.py \
            --ledger \
            --json

      - name: Replay inactive V4 bridge checkpoint
        shell: bash
        env:
          SUBJECT_V4_INACTIVE_CHECKPOINT: 5ce070ddfdf2511b76e497f6c296826b6a70c050
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SUBJECT_V4_INACTIVE_CHECKPOINT" HEAD
          replay_root="$RUNNER_TEMP/subject-v4-inactive-${{ matrix.python-version }}"
          cleanup() {
            git worktree remove --force "$replay_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$replay_root" "$SUBJECT_V4_INACTIVE_CHECKPOINT"
          cd "$replay_root"
          cat <<'EOF' | sha256sum -c -
          6a3721de9f6211972d2cadc22fcc427d65eb4d3a2f66352940e03f8c928dee70  scripts/run_subject_development_mission_v4.py
          1ebcb46928474c3b305456b98ab2517872edd52a41e0cd0c83f2b9f273f4fa8e  scripts/validate_subject_development_mission_v4.py
          8253fabeebaef5a6aa5655280e0210f90250882da46081951a4a2183891f3d37  scripts/validate_subject_task_authorization_dispatch_v4.py
          e264da10e3b8e016eba78029307eaf1cefe6922b8f4172b29ce7ecc87bf411d3  specs/subject-distillation/development-mission-v4.contract.json
          28478445e3eeb5b838b010fa81518d4fcbbb5c6a37422cb3aa58dabdcbf87626  specs/subject-distillation/implementation-progress.json
          cd79b8513a1e746643946e2340703c29fb6721b6645e11c82c0de0bb862f51d0  tests/test_subject_development_mission_v4.py
          8b54f8c11aa748824483b5122c04aa28699bc0309c1a1eabc00d9fa3cecea3f0  tests/test_subject_task_authorization_dispatch_v4.py
          EOF
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/test_subject_development_mission_v4.py::test_contract_is_closed_and_inactive_before_owner_confirmation \
            tests/test_subject_task_authorization_dispatch_v4.py::test_dispatch_accepts_inactive_bridge_only_at_exact_t003_terminal_prefix
          python scripts/validate_subject_task_authorization_dispatch_v4.py \
            --ledger \
            --json

      - name: Replay immutable V4 activation checkpoint
        shell: bash
        env:
          SUBJECT_V4_ACTIVATION_CHECKPOINT: 03dcdabc873658cd7de24dfeeef8b85090cf2321
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SUBJECT_V4_ACTIVATION_CHECKPOINT" HEAD
          replay_root="$RUNNER_TEMP/subject-v4-activation-${{ matrix.python-version }}"
          cleanup() {
            git worktree remove --force "$replay_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$replay_root" "$SUBJECT_V4_ACTIVATION_CHECKPOINT"
          cd "$replay_root"
          cat <<'EOF' | sha256sum -c -
          6a3721de9f6211972d2cadc22fcc427d65eb4d3a2f66352940e03f8c928dee70  scripts/run_subject_development_mission_v4.py
          6873bcb7a217901f75ca7c4271202869a3ac348259f5ca7ebcefdba80a5ac61f  scripts/update_subject_task_progress_v4.py
          1ebcb46928474c3b305456b98ab2517872edd52a41e0cd0c83f2b9f273f4fa8e  scripts/validate_subject_development_mission_v4.py
          8253fabeebaef5a6aa5655280e0210f90250882da46081951a4a2183891f3d37  scripts/validate_subject_task_authorization_dispatch_v4.py
          e264da10e3b8e016eba78029307eaf1cefe6922b8f4172b29ce7ecc87bf411d3  specs/subject-distillation/development-mission-v4.contract.json
          b561c8fb2c67bbf3f0360d535c287c6332b45098b846efc08fe1d5473397f06d  specs/subject-distillation/development-mission-v4.schema.json
          3b0ae32a35af5ad4e5ef85558f612b6f2a78ba45b28b37fa2272337300b508c4  specs/subject-distillation/task-scope-manifest-v4.json
          8c581721fb3a4da7aa8107ed4c4fc490c9a96e45843f854c4da4c8d77f411411  specs/subject-distillation/task-authorizations/MISSION-T004-T033.json
          28478445e3eeb5b838b010fa81518d4fcbbb5c6a37422cb3aa58dabdcbf87626  specs/subject-distillation/implementation-progress.json
          461ceca4a894d73c05414be7d0ba8f145b52cd1a4d2ab83b76e5ca62d3cbb499  docs/decision_records/2026-08-13-subject-development-mission-v4.md
          7b00d9306bbb2f84a03e561c001a3462a4840b8ee106c3e084330b5b555e3f4f  tests/test_subject_development_mission_v4.py
          7f31efbc18226688919bbd09cf2112178c69268e9fda13bf6114aa7caf66b5ea  tests/test_subject_task_authorization_dispatch_v4.py
          EOF
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/test_subject_development_mission_v4.py \
            tests/test_subject_task_authorization_dispatch_v4.py
          python scripts/validate_subject_task_authorization_dispatch_v4.py \
            --ledger \
            --json

      - name: Validate current Subject Development Mission v5 overlay
        run: |
          cat <<'EOF' | sha256sum -c -
          32ae8d821b991910b04ec29904fa3861389dd4807a2c000948264ec60bbb1b9b  scripts/run_subject_development_mission_v5.py
          7a3c0d95d3ff81231ba79aeb2e8b29d67e00486caf43537bb26d89cfea590ed7  scripts/run_subject_identity_test_isolation.py
          64d10f43f4a92ae1ca047e1516e93d4c5b0c0b78098601889e9152e240df365c  scripts/update_subject_task_progress_v5.py
          d79bf1ee1268e2fc8a0cbaafb6f9abec9e5057643dc4c1dcb34b4db68446737e  scripts/validate_subject_development_mission_v5.py
          a70e365e5691981b4d19a80929667c50014800e77f04bdf825296e6ead953c58  scripts/validate_subject_task_authorization_dispatch_v5.py
          9dfb66e13fb5a43841a0894e0e91e014c7ef714889c2342a5e62d98deb7b2467  specs/subject-distillation/development-mission-v5.contract.json
          9146ee58d8ff5a82dbec41bb7da94564b09c32a163645a4c47b0f761e1de3406  specs/subject-distillation/development-mission-v5.schema.json
          c2d55591e677f923981fa6dc242c47d98cd0e13fb43a844f8cf9b5a9060dd1db  specs/subject-distillation/task-scope-manifest-v5.json
          78bbc6fde5c60d96c6bd642636b4516536717489d34ad47dbdd2cc812b491a91  docs/decision_records/2026-08-14-subject-development-mission-v5-recovery.md
          48ab486c3326f1903c625bb9b1fa162c3a44ea3fdd120c63777f636b13a657e4  specs/subject-distillation/development-missions/README.md
          fd4d576b209af9f7e5efdc5bcc9fd6872ef46009e9fc6358ccce30fd2aeba46b  tests/test_subject_development_mission_v5.py
          50a6385edcbb3ae4ca92fbef227a41029b9708584d711eeb40383b81699fd64d  tests/test_subject_task_authorization_dispatch_v5.py
          4e0185489d5598fd312c824ad40952efaa7a9d2c87c1ee3d772237ccfd882188  tests/test_repo_hygiene_tools.py
          fad00cb5058f80fd074553ec399e72a76f91c113d42569a4ce6d606fa301dbc7  evidence/DEP-SDG-010-MISSION-V5-CI-PHASE-ROUTING/rollback.md
          EOF
          python scripts/validate_subject_task_authorization_dispatch_v5.py \
            --ledger \
            --json

      - name: Compile Python sources
        run: python -m compileall -q vault scripts tests

  readme-command-smoke:
    name: README documented command smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run README documented command smoke
        run: python scripts/readme_command_smoke.py

  one-click-install-smoke-linux:
    name: One-click installer smoke (Linux)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run installer
        run: VAULT_PACKAGE_SPEC=".[mcp]" bash scripts/install.sh

      - name: Verify installed CLI
        run: .venv/bin/vault --version

  one-click-install-smoke-windows:
    name: One-click installer smoke (Windows)
    runs-on: windows-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run installer
        shell: pwsh
        run: |
          $env:VAULT_PACKAGE_SPEC = ".[mcp]"
          ./scripts/install.ps1

      - name: Verify installed CLI
        shell: pwsh
        run: ./.venv/Scripts/vault.exe --version

  uv-dev-smoke:
    name: uv dev workflow smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Check uv lockfile
        run: uv lock --check

      - name: Sync developer environment
        run: uv sync --frozen --python 3.12 --extra dev --extra mcp

      - name: Smoke test uv-managed tools
        run: |
          uv run --python 3.12 vault --version
          uv run --python 3.12 python -m pytest -q tests/test_lite.py tests/test_cli_project_dir.py

  search-qa-regression:
    name: Search QA regression gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run public Search QA regression gate
        run: python scripts/search_qa_regression_gate.py

  memory-foundation-contract:
    name: Memory foundation governance contract
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run dynamic VaultGovBench suite
        run: |
          python benchmarks/memory_foundation_compare.py governance-run \
            --fixture benchmarks/vault_gov_bench/v0.1.json \
            --output /tmp/vault-governance-run.json

      - name: Export and validate blinded provider input
        run: |
          python benchmarks/external_memory_compare.py export-provider-input \
            --fixture benchmarks/vault_gov_bench/retrieval_v0.1.json \
            --output /tmp/vault-provider-input.json
          python - <<'PY'
          import json
          from pathlib import Path

          from benchmarks.external_memory_compare import (
              PROVIDER_CASE_FIELDS,
              PROVIDER_DOCUMENT_FIELDS,
              PROVIDER_GOVERNANCE_FIELDS,
              fixture_digest,
          )

          gold = json.loads(
              Path("benchmarks/vault_gov_bench/retrieval_v0.1.json").read_text(
                  encoding="utf-8"
              )
          )
          provider_input = json.loads(
              Path("/tmp/vault-provider-input.json").read_text(encoding="utf-8")
          )
          allowed_document_fields = set(PROVIDER_DOCUMENT_FIELDS) | {"governance"}
          allowed_case_fields = set(PROVIDER_CASE_FIELDS)
          allowed_governance_fields = set(PROVIDER_GOVERNANCE_FIELDS)

          assert provider_input["provider_input"] is True
          assert provider_input["gold_labels_excluded"] is True
          assert provider_input["fixture_digest"] == fixture_digest(gold)
          assert provider_input["provider_input_digest"] == fixture_digest(
              provider_input
          )
          assert provider_input["provider_input_digest"] != provider_input["fixture_digest"]
          assert provider_input["documents_total"] == len(gold["documents"])
          assert provider_input["cases_total"] == len(gold["cases"])
          assert all(
              set(document) <= allowed_document_fields
              for document in provider_input["documents"]
          )
          assert all(
              set(case) <= allowed_case_fields for case in provider_input["cases"]
          )
          assert all(
              set(document.get("governance") or {}) <= allowed_governance_fields
              for document in provider_input["documents"]
          )
          PY

      - name: Run paired governance-aware retrieval contract
        run: |
          python benchmarks/memory_foundation_compare.py augment-run \
            --fixture benchmarks/vault_gov_bench/retrieval_v0.1.json \
            --engine-run benchmarks/vault_gov_bench/frozen_candidate_pool_v0.1.json \
            --output /tmp/vault-governance-augmented.json \
            --mode guard-only \
            --top-k 1 \
            --candidate-pool-k 4
          python benchmarks/memory_foundation_compare.py score-pair \
            --fixture benchmarks/vault_gov_bench/retrieval_v0.1.json \
            --baseline-run benchmarks/vault_gov_bench/frozen_candidate_pool_v0.1.json \
            --augmented-run /tmp/vault-governance-augmented.json \
            --output /tmp/vault-governance-paired.json \
            --top-k 1

      - name: Enforce public contract gates
        run: |
          python -c "import json; p=json.load(open('/tmp/vault-governance-run.json')); assert p['status']=='pass' and p['cases_total']==19 and p['cases_passed']==17 and p['cases_failed']==0 and p['capability_gaps_total']==2"
          python -c "import json; p=json.load(open('/tmp/vault-governance-paired.json')); assert p['cases_total']==6 and p['augmented']['forbidden_exposures']==0 and p['augmented']['relevant_blocked_by_policy']==0"

      - name: Upload reproducible benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: memory-foundation-contract-${{ github.sha }}
          path: |
            /tmp/vault-governance-run.json
            /tmp/vault-provider-input.json
            /tmp/vault-governance-augmented.json
            /tmp/vault-governance-paired.json
          retention-days: 30

  build-smoke:
    name: Build, twine check, and wheel smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel outside source tree
        run: |
          python -m venv /tmp/vfl-wheel-smoke
          /tmp/vfl-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/vfl-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vfl-wheel-smoke/bin/vault --help
          /tmp/vfl-wheel-smoke/bin/vault init
          /tmp/vfl-wheel-smoke/bin/vault freshness --limit 1
          /tmp/vfl-wheel-smoke/bin/vault dedup --dry-run --threshold 0.99
          /tmp/vfl-wheel-smoke/bin/vault converge --limit 1
          /tmp/vfl-wheel-smoke/bin/vault cross-validate --limit 1 --local-only
          /tmp/vfl-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import scripts.convergence_check
          import scripts.cross_validate
          import scripts.deduplicate_semantic
          import scripts.freshness_check

          print(metadata.version('vault-for-llm'))
          PY

  release-parity:
    name: Release version parity
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check local version file parity
        if: github.ref_type != 'tag'
        run: python scripts/check_release_parity.py

      - name: Check release tag parity
        if: github.ref_type == 'tag'
        run: python scripts/check_release_parity.py --tag "$GITHUB_REF_NAME"

      - name: Verify tag resolves to checked commit
        if: github.ref_type == 'tag'
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Release tag $GITHUB_REF_NAME resolves to $tag_commit, but CI checked $head_commit" >&2
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME resolves to checked commit $head_commit"

  module-size:
    name: Module size gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check module size baseline
        run: python scripts/module_size_gate.py

  lint-knowledge:
    name: Lint raw/ knowledge files
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Lint YAML frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          errors = 0
          raw_root = Path('raw')
          files = sorted(raw_root.rglob('*.md')) if raw_root.exists() else []
          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  print(f"❌ {path}: missing YAML frontmatter")
                  errors += 1
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  print(f"❌ {path}: malformed YAML frontmatter")
                  errors += 1
                  continue
              try:
                  frontmatter = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError as exc:
                  print(f"❌ {path}: invalid YAML frontmatter: {exc}")
                  errors += 1
                  continue
              for field in ('title', 'category'):
                  if field not in frontmatter:
                      print(f"⚠️  {path}: missing '{field}' in frontmatter")
                      errors += 1
              title = str(frontmatter.get('title', ''))
              if len(title) > 100:
                  print(f"⚠️  {path}: title too long ({len(title)} chars)")
                  errors += 1

          if errors:
              print(f"❌ Found {errors} issue(s)")
              sys.exit(1)
          print('✅ All knowledge files pass lint')
          PY

      - name: Check duplicate titles
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import yaml

          titles = []
          raw_root = Path('raw')
          for path in sorted(raw_root.rglob('*.md')) if raw_root.exists() else []:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  continue
              parts = text.split('---', 2)
              if len(parts) < 3:
                  continue
              try:
                  frontmatter = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError:
                  continue
              title = frontmatter.get('title')
              if title:
                  titles.append(str(title))
          dupes = sorted(title for title, count in Counter(titles).items() if count > 1)
          if dupes:
              print('⚠️  Duplicate titles found:')
              for title in dupes:
                  print(title)
          else:
              print('✅ No duplicate titles')
          PY

      - name: Knowledge stats
        run: |
          python - <<'PY'
          from pathlib import Path

          counts = {}
          for name in ('raw', 'L0-identity', 'L1-core-facts', 'L2-context'):
              root = Path(name)
              counts[name] = sum(1 for _ in root.rglob('*.md')) if root.exists() else 0
          total = sum(counts.values())
          print('📊 Knowledge stats:')
          print(
              f"  raw/: {counts['raw']}  L0: {counts['L0-identity']}  "
              f"L1: {counts['L1-core-facts']}  L2: {counts['L2-context']}  Total: {total}"
          )
          PY

  secret-scan-light:
    name: Lightweight secret scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan for high-risk secret patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          excluded_dirs = {
              '.git', '.hg', '.svn', '.tox', '.nox', '.venv', 'venv', 'env',
              'dist', 'build', '__pycache__', '.pytest_cache', '.ruff_cache',
              '.mypy_cache', 'htmlcov', 'vault_for_llm.egg-info',
          }
          # Files that intentionally contain fake secrets for testing privacy scan
          excluded_files = {
              'tests/test_privacy_extended.py',
              'tests/test_privacy.py',
          }
          included_roots = [
              Path('vault'), Path('scripts'), Path('tests'), Path('docs'), Path('raw'),
              Path('benchmarks'), Path('.github/workflows'),
              Path('.agentic-sdd-governance'),
              Path('.agents/skills/agentic-sdd-governance'), Path('.sddgov'),
              Path('evidence'),
          ]
          included_roots.extend(
              path for path in Path('.').glob('DEP-*') if path.is_dir()
          )
          included_files = [
              Path('README.md'), Path('CHANGELOG.md'), Path('pyproject.toml'),
              Path('AGENTS.md'),
          ]
          suffixes = {'.py', '.md', '.toml', '.yml', '.yaml', '.json', '.txt'}
          patterns = {
              'private key block': re.compile(r'-----BEGIN [A-Z ]+ PRIVATE KEY-----'),
              'AWS access key': re.compile(r'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'),
              'GitHub token': re.compile(r'\bgh[pousr]_[A-Za-z0-9_]{36,255}\b'),
              'OpenAI-style API key': re.compile(r'\bsk-[A-Za-z0-9]{20,}\b'),
              'Anthropic API key': re.compile(r'\bsk-ant-[A-Za-z0-9_-]{20,}\b'),
              'Slack token': re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              'JWT': re.compile(r'\beyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\b'),
          }

          def should_skip(path: Path) -> bool:
              if any(part in excluded_dirs for part in path.parts):
                  return True
              return str(path) in excluded_files

          candidates = []
          for root in included_roots:
              if root.exists() and not should_skip(root):
                  candidates.extend(
                      path for path in root.rglob('*')
                      if path.is_file() and path.suffix in suffixes and not should_skip(path)
                  )
          candidates.extend(path for path in included_files if path.exists() and not should_skip(path))

          findings = []
          for path in sorted(set(candidates)):
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), start=1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((path, line_no, label))

          if findings:
              print('❌ Potential high-risk secrets found:')
              for path, line_no, label in findings:
                  print(f'{path}:{line_no}: {label}')
              sys.exit(1)
          print('✅ No high-risk secret patterns found')
          PY

  history-privacy-scan:
    name: Full history privacy scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan reachable history for private context
        run: python scripts/history_privacy_scan.py

  governance-merge-gate:
    name: Agentic SDD Governance merge gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    timeout-minutes: 20

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and pinned governance runtime
        run: |
          python -m venv "$RUNNER_TEMP/sddgov-venv"
          "$RUNNER_TEMP/sddgov-venv/bin/python" -m pip install --upgrade pip
          governance_wheel="$RUNNER_TEMP/agentic_sdd_governance-0.2.0.dev6-py3-none-any.whl"
          curl --fail --location --silent --show-error \
            "https://github.com/zycaskevin/Agentic-SDD-Governance/releases/download/v0.2.0-experimental.6/agentic_sdd_governance-0.2.0.dev6-py3-none-any.whl" \
            --output "$governance_wheel"
          python - "$governance_wheel" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          expected = "e89eb0b5d6c3497068b4335ac45b91cc92d5c4e4705921f8348c844ea73b9cf5"
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("governance wheel SHA-256 mismatch")
          print(f"governance wheel SHA-256 verified: {actual}")
          PY
          "$RUNNER_TEMP/sddgov-venv/bin/python" -m pip install -e ".[dev]" \
            "$governance_wheel"
          printf '%s\n' "$RUNNER_TEMP/sddgov-venv/bin" >> "$GITHUB_PATH"

      - name: Materialize public reviewer trust outside the repository
        env:
          SDDGOV_TRUSTED_REVIEWERS_JSON: ${{ vars.SDDGOV_TRUSTED_REVIEWERS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("SDDGOV_TRUSTED_REVIEWERS_JSON", "")
          if not raw:
              raise SystemExit("SDDGOV_TRUSTED_REVIEWERS_JSON is not configured")
          value = json.loads(raw)
          if set(value) != {"schema_version", "reviewers"}:
              raise SystemExit("trusted reviewer JSON has an invalid top-level shape")
          target = Path(os.environ["RUNNER_TEMP"]) / "sddgov-trusted-reviewers.json"
          target.write_text(json.dumps(value, ensure_ascii=False) + "\n", encoding="utf-8")
          target.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SDDGOV_TRUSTED_REVIEWERS_FILE={target}\n")
          PY

      - name: Verify exact merge gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          "$RUNNER_TEMP/sddgov-venv/bin/sddgov" merge verify .
          --base-ref "$PR_BASE_SHA"
