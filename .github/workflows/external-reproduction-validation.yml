name: External reproduction validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/external_reproductions/**"
      - "benchmarks/schemas/external_reproduction_submission.v1.schema.json"
      - "scripts/validate_external_reproduction.py"
      - "scripts/preflight_external_reproduction.py"
      - "scripts/external_reproduction_models.py"
      - "scripts/run_external_reproduction.py"
      - "tests/test_external_reproduction.py"
      - ".github/workflows/external-reproduction-validation.yml"

permissions:
  contents: read

concurrency:
  group: external-reproduction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test the fail-closed validator
        run: python -m pytest -q tests/test_external_reproduction.py
      - name: Validate submitted manifests
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            found=1
            python scripts/validate_external_reproduction.py "$(dirname "${manifest}")" --json
          done < <(find benchmarks/external_reproductions -mindepth 2 -name submission.json -print)
          if [[ "${found}" -eq 0 ]]; then
            echo "No checked-in external reproduction submission to validate."
          fi
